[package]
name = "ossdeck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
futures = "0.3.34"
gpui = "0.2.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
objc2-user-notifications = "0.3.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
